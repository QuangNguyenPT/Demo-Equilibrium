[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hrm"
version = "0.1.0"
description = "Unified cognitive model: PEM-derived reasoning, native language section, SSD-resident knowledge, metacognition"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8"]
eqb = ["torch>=2.4"]

[tool.setuptools.packages.find]
include = ["hrm", "hrm.*", "hrm_eqb", "hrm_eqb.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
